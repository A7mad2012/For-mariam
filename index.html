<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Mariam 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d0f24;--ink:#fff1f5;--rose:#ff8fb1;--gold:#ffd58a;--mute:#c9a7bb;--card:#2b1736;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f24;--ink:#fff1f5}}
:root[data-theme="dark"]{--bg:#1d0f24;--ink:#fff1f5}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity 1.2s}
canvas.on{opacity:1}canvas.dim{opacity:.22}
.scr{display:none;position:relative;z-index:1;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.scr.on{display:flex}
.script{font-family:'Caveat',cursive;font-weight:700}
#gift{background:none;border:0;cursor:pointer;color:inherit;font:inherit}
#gift .box{font-size:96px;display:block;animation:bob 2.2s ease-in-out infinite}
#gift .hint{font-family:'Caveat',cursive;font-size:30px;color:var(--gold)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
#count{font-family:'Caveat',cursive;font-size:min(46vw,220px);color:var(--rose);line-height:1}
#line{font-size:clamp(34px,9vw,64px);color:var(--ink);text-shadow:0 2px 24px #000;max-width:14em;line-height:1.15;min-height:2.4em;transition:opacity .6s}
#gallery{justify-content:flex-start;padding-top:48px;padding-bottom:64px;gap:36px}
#gallery h2{font-size:clamp(40px,10vw,68px);margin:0;color:var(--gold)}
.pol{background:#fff8f3;color:#3a2438;padding:12px 12px 16px;width:min(300px,78vw);border-radius:4px;box-shadow:0 14px 40px #0008;transform:rotate(var(--r))}
.pol .ph{aspect-ratio:4/5;width:100%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,#ffb3c8,#c59bff);color:#fff;font-size:15px}
.pol .ph span{font-size:40px;display:block}
.pol p{margin:12px 0 0;font-family:'Caveat',cursive;font-size:26px}
.letter{max-width:22em;background:var(--card);border-radius:16px;padding:28px 26px;line-height:1.7;font-size:18px;text-align:left}
.letter b{font-family:'Caveat',cursive;font-size:30px;color:var(--rose);display:block;margin-bottom:6px}
button.again{font:inherit;color:var(--ink);background:none;border:1px solid var(--mute);border-radius:999px;padding:10px 22px;cursor:pointer}
.letter.ar{font-family:'Cairo',system-ui,sans-serif;line-height:1.9;text-align:right}
.letter.ar b{font-family:'Cairo',system-ui,sans-serif;font-size:24px}
button.tr{margin-top:-18px;font-size:15px;padding:8px 18px}
#clickme{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:none;border:0;padding:12px 16px;color:var(--ink);font-family:'Caveat',cursive;font-weight:700;font-size:38px;cursor:pointer;z-index:5;transition:left .25s,top .25s;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.heart{position:fixed;bottom:-30px;z-index:2;pointer-events:none;animation:rise 6s linear forwards}
@keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
@media (prefers-reduced-motion:reduce){#gift .box{animation:none}}
</style>
</head>
<body>
<canvas id="rain"></canvas>

<section id="s0" class="scr on"><button id="clickme">Click me</button></section>

<section id="s1" class="scr">
  <button id="gift" aria-label="Open your gift"><span class="box">🎁</span><span class="hint">tap to open</span></button>
</section>

<section id="s2" class="scr"><div id="count" aria-live="polite">3</div></section>

<section id="s3" class="scr"><div id="line" class="script"></div></section>

<section id="s4" class="scr">
  <div id="gallery" class="scr on" style="display:flex">
    <h2 class="script" id="title"></h2>
    <div id="pols" style="display:contents"></div>
    <div class="letter"><b id="lt"></b><span id="lbody"></span></div>
    <button class="again tr" id="tr">ترجمه عشان انتي فلاحه 😂</button>
    <button class="again" id="again">Watch again</button>
  </div>
</section>

<script>
/* ---- EDIT THESE ---- */
const NAME = "Mariam";
const LINES = ["Hey Mariam…", "I made something for you", "My little sister, my favorite person", "Happy 12th Birthday ♥"];
/* src: your photo as a data URL or hosted image; leave "" to show a placeholder */
const PHOTOS = [
{src:"PHOTO_DATA_URL", cap:"Skating day", pos:"50% 30%"},
{src:"PHOTO_DATA_URL", cap:"Egypt adventures", pos:"68% 78%"},
{src:"PHOTO_DATA_URL", cap:"Mario mode", pos:"50% 40%"},
{src:"PHOTO_DATA_URL", cap:"Peace out", pos:"50% 55%"},
{src:"PHOTO_DATA_URL", cap:"That face", pos:"50% 35%"},
{src:"PHOTO_DATA_URL", cap:"Pure smile", pos:"50% 30%"},
{src:"PHOTO_DATA_URL", cap:"Carried away", pos:"50% 50%"},
{src:"PHOTO_DATA_URL", cap:"Cake time", pos:"49% 50%"},
{src:"PHOTO_DATA_URL", cap:"Us two", pos:"50% 60%"},
{src:"PHOTO_DATA_URL", cap:"By the sea", pos:"50% 55%"},
{src:"PHOTO_DATA_URL", cap:"Sunshine and a big hat", pos:"54% 50%"},
{src:"PHOTO_DATA_URL", cap:"Night ride", pos:"50% 25%"}
];
const LETTER = "Happy 12th Birthday to my amazing little sister! I still remember teaching you how to walk and talk when I was just 5 and you were 2, and I can’t believe how fast you’re growing up now. Even though we used to fight constantly over absolute nonsense, having you in my life is the greatest gift, and I am so proud of the kind and wonderful person you’re becoming. I hope your day is filled with all your favorite things, and I’ll always be right here cheering you on no matter what. Love you so much!";
const RAIN = "MARIAM♥";
/* music: put a data URL or hosted audio link here; it starts when she taps the gift */
const MUSIC = "AUDIO_DATA_URL";
let audio = null;
/* -------------------- */
const $ = id => document.getElementById(id);
const AR_HEAD = "مريم حبيبتي،";
const AR_LETTER = "كل سنة وانتي طيبة يا أحلى أخت صغيرة في الدنيا! عيد ميلاد سعيد وانتي بتكملي 12 سنة! عمري ما هنسى لما علّمتك تمشي وتتكلمي وأنا عندي 5 سنين وانتي سنتين، ودلوقتي الوقت بيجري وانتي بتكبري قدام عينيا. ورغم إننا كنا بنتخانق طول الوقت على حاجات تافهة خالص، وجودك في حياتي هو أحلى هدية، وقلبي مليان فخر بيكي وانتي بتبقي إنسانة طيبة وجميلة. أتمنى يومك يتملي بكل الحاجات اللي بتحبيها، وأنا دايمًا جنبك بشجعك مهما حصل. بحبك أوي!";
let isAr = false;
function setLang(ar){
  isAr = ar; const L = document.querySelector(".letter");
  L.classList.toggle("ar", ar); L.dir = ar ? "rtl" : "ltr";
  $("lt").textContent = ar ? AR_HEAD : "Dear " + NAME + ",";
  $("lbody").textContent = ar ? AR_LETTER : LETTER;
  $("tr").textContent = ar ? "English" : "ترجمه عشان انتي فلاحه 😂";
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const show = id => ["s0","s1","s2","s3","s4"].forEach(s => $(s).classList.toggle("on", s === id));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* falling text */
const cv = $("rain"), cx = cv.getContext("2d");
let cols = [], raf = 0, heartT = 0;
function size(){ cv.width = innerWidth; cv.height = innerHeight; const n = Math.floor(cv.width/22); cols = Array.from({length:n}, () => Math.random()*cv.height/18); }
addEventListener("resize", size); size();
function draw(){
  cx.fillStyle = "rgba(29,15,36,.14)"; cx.fillRect(0,0,cv.width,cv.height);
  cx.font = "20px 'DM Sans',sans-serif";
  cols.forEach((y,i) => {
    cx.fillStyle = i % 3 ? "#ff8fb1" : "#ffd58a";
    cx.fillText(RAIN[Math.floor(Math.random()*RAIN.length)], i*22, y*18);
    cols[i] = (y*18 > cv.height && Math.random() > .96) ? 0 : y + 1;
  });
  raf = requestAnimationFrame(draw);
}

/* flow */
async function run(){
  show("s2");
  $("count").textContent = 3; await sleep(1200); $("count").textContent = 2; await sleep(1000); $("count").textContent = 1; await sleep(1000);
  show("s3"); cv.classList.add("on"); cv.classList.remove("dim");
  if (!reduce) draw();
  const el = $("line");
  for (const t of LINES) { el.style.opacity = 0; await sleep(400); el.textContent = t; el.style.opacity = 1; await sleep(2200); }
  el.style.opacity = 0; await sleep(500);
  showGallery();
}
function showGallery(){
  show("s4"); window.scrollTo(0,0); cv.classList.add("dim");
  $("title").textContent = "For " + NAME;
  setLang(false);
  $("pols").innerHTML = "";
  PHOTOS.forEach((p,i) => {
    const d = document.createElement("div"); d.className = "pol"; d.style.setProperty("--r", (i%2 ? 3 : -3) + "deg");
    const ph = p.src ? Object.assign(document.createElement("img"), {src:p.src, alt:p.cap, className:"ph", style:"object-position:"+p.pos})
                     : Object.assign(document.createElement("div"), {className:"ph", innerHTML:"<div><span>📷</span>Your photo here</div>"});
    const c = document.createElement("p"); c.textContent = p.cap;
    d.append(ph, c); $("pols").append(d);
  });
  if (!reduce) { clearInterval(heartT); heartT = setInterval(heart, 700); }
}
function heart(){
  const h = document.createElement("div"); h.className = "heart"; h.textContent = Math.random() > .5 ? "♥" : "💗";
  h.style.left = Math.random()*100 + "vw"; h.style.fontSize = 14 + Math.random()*20 + "px"; h.style.color = "#ff8fb1";
  h.style.setProperty("--dx", (Math.random()*80 - 40) + "px");
  document.body.append(h); setTimeout(() => h.remove(), 6200);
}
$("gift").onclick = () => { if (MUSIC) { try { audio = new Audio(MUSIC); audio.onended = () => { audio.currentTime = 3.4; audio.play().catch(() => {}); }; audio.play().catch(() => {}); } catch (e) {} } run(); };
/* click-me gate: 5 clicks unlock the site */
const cm = $("clickme"); let hits = 0, locked = true;
function jump(){
  const w = cm.offsetWidth, h = cm.offsetHeight;
  const ox = cm.offsetLeft, oy = cm.offsetTop; let x, y, tries = 0;
  do {
    x = 16 + Math.random() * Math.max(1, innerWidth - w - 32);
    y = 70 + Math.random() * Math.max(1, innerHeight - h - 140);
  } while (tries++ < 12 && Math.hypot(x - ox, y - oy) < 140);
  cm.style.transform = "none"; cm.style.left = x + "px"; cm.style.top = y + "px";
}
cm.onclick = () => {
  if (!locked) return;
  hits++;
  if (hits < 5) { jump(); return; }
  locked = false; cm.textContent = "unlock 🔓";
  cm.style.left = "50%"; cm.style.top = "50%"; cm.style.transform = "translate(-50%,-50%)";
  setTimeout(() => show("s1"), 1300);
};
$("tr").onclick = () => setLang(!isAr);
$("again").onclick = () => { if (audio) audio.pause(); clearInterval(heartT); cancelAnimationFrame(raf); cv.classList.remove("on","dim"); show("s1"); window.scrollTo(0,0); };
</script>
</body>
</html>
